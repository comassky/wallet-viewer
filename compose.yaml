services:
  wallet-viewer:
    image: ${WALLET_VIEWER_IMAGE:-wallet-viewer:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # The API has no authentication: keep it local unless protected by a proxy.
      # Proxy /api/wallet/live with HTTP/1.1, Host/Origin and Upgrade/Connection;
      # use HTTPS/wss and timeouts greater than 90s. See README for details.
      - "127.0.0.1:${WALLET_VIEWER_PORT:-8080}:8080"
    environment:
      WALLET_XPUB: "${WALLET_XPUB:?Define WALLET_XPUB in .env before starting}"
      WALLET_NETWORK: "${WALLET_NETWORK:-mainnet}"
      WALLET_SCRIPT_TYPE: "${WALLET_SCRIPT_TYPE:-auto}"
      WALLET_GAP_LIMIT: "${WALLET_GAP_LIMIT:-20}"
      WALLET_MAX_ADDRESSES: "${WALLET_MAX_ADDRESSES:-200}"
      ELECTRUM_HOST: "${ELECTRUM_HOST:-electrum.blockstream.info}"
      ELECTRUM_PORT: "${ELECTRUM_PORT:-50002}"
      ELECTRUM_SSL: "${ELECTRUM_SSL:-true}"
      ELECTRUM_REQUEST_TIMEOUT: "${ELECTRUM_REQUEST_TIMEOUT:-30s}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"