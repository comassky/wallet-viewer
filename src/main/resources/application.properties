# ---------------------------------------------------------------------------
# Electrum / electrs server connection
# ---------------------------------------------------------------------------
electrum.host=electrum.blockstream.info
electrum.port=50001
electrum.ssl=false

# ---------------------------------------------------------------------------
# Wallet configuration
#   wallet.xpub : account-level extended PUBLIC key (zpub / ypub / xpub).
#     - zpub -> BIP84 native segwit (bc1...)        m/84'/0'/0'
#     - ypub -> BIP49 wrapped segwit (3...)         m/49'/0'/0'
#     - xpub -> BIP44 legacy (1...)                 m/44'/0'/0'
#   wallet.script-type : auto | p2pkh | p2sh-p2wpkh | p2wpkh | p2tr
#     For Taproot (BIP86, bc1p...) the key is a plain xpub, so set p2tr explicitly.
# ---------------------------------------------------------------------------
# Supply WALLET_XPUB at runtime, or use an untracked config/application.properties.
wallet.network=mainnet
wallet.script-type=auto
wallet.gap-limit=20
# Demo mode: serve a synthetic, self-consistent wallet (no Electrum, no real xpub).
# Enable with WALLET_DEMO=true for screenshots and UI previews.
wallet.demo=false
# History scan cap per chain. A next receive address beyond this cap is watched
# without history; increase the cap to include its funds accurately.
wallet.max-addresses=200
# Wallet snapshots use an event-driven, in-memory Caffeine cache without TTL.
# State is instance-local and is rebuilt after process restart.

# ---------------------------------------------------------------------------
# HTTP / Quinoa (Vue frontend served by Quarkus)
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
# Isolate each Node release so upgrades cannot mix incompatible bundled npm files.
quarkus.quinoa.package-manager-install.install-dir=.quinoa/node-24.21.0
quarkus.quinoa.package-manager-install.node-version=24.21.0

# ---------------------------------------------------------------------------
# Logging
#   Operational lifecycle logs (Electrum connections, notifications and wallet
#   scans) are emitted at DEBUG. Set LOG_LEVEL=DEBUG to see them; the default
#   INFO keeps startup details (e.g. detected script type), warnings and errors.
# ---------------------------------------------------------------------------
quarkus.log.category."com.comassky.wallet".level=${LOG_LEVEL:INFO}
