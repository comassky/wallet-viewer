# ---------------------------------------------------------------------------
# Electrum / electrs server connection
# ---------------------------------------------------------------------------
electrum.host=electrum.blockstream.info
electrum.port=50001
electrum.ssl=false

# ---------------------------------------------------------------------------
# Wallet configuration
#   wallet.xpub : account-level extended PUBLIC key (zpub / ypub / xpub).
#     - zpub -> BIP84 native segwit (bc1...)        m/84'/0'/0'
#     - ypub -> BIP49 wrapped segwit (3...)         m/49'/0'/0'
#     - xpub -> BIP44 legacy (1...)                 m/44'/0'/0'
#   wallet.script-type : auto | p2pkh | p2sh-p2wpkh | p2wpkh | p2tr
#     For Taproot (BIP86, bc1p...) the key is a plain xpub, so set p2tr explicitly.
# ---------------------------------------------------------------------------
# Supply WALLET_XPUB at runtime, or use an untracked config/application.properties.
wallet.network=mainnet
wallet.script-type=auto
wallet.gap-limit=20
wallet.max-addresses=200
wallet.cache-ttl-seconds=30

# ---------------------------------------------------------------------------
# HTTP / Quinoa (Vue frontend served by Quarkus)
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
# Isolate each Node release so upgrades cannot mix incompatible bundled npm files.
quarkus.quinoa.package-manager-install.install-dir=.quinoa/node-22.22.0
quarkus.quinoa.package-manager-install.node-version=22.22.0
