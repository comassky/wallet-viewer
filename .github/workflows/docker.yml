name: Docker image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # actions/cache stores each build cache dir; declared before the cache-dance
      # step so their save (post) runs after the mounts are extracted back to disk.
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: .m2-cache
          key: m2-${{ hashFiles('pom.xml') }}
          restore-keys: m2-

      - name: Cache Quinoa Node install
        uses: actions/cache@v6
        with:
          path: .quinoa-cache
          key: quinoa-${{ hashFiles('src/main/resources/application.properties') }}
          restore-keys: quinoa-

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: .npm-cache
          key: npm-${{ hashFiles('src/main/webui/package-lock.json') }}
          restore-keys: npm-

      # Persist the BuildKit cache mounts (not covered by type=gha) across runs.
      - name: Inject build caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              ".m2-cache": "/root/.m2",
              ".quinoa-cache": "/workspace/.quinoa",
              ".npm-cache": "/root/.npm"
            }

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # Pushes to the default branch (main) publish a single 'dev' tag.
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test, build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max