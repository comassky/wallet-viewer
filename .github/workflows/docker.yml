name: Docker - Build and Publish Dev

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          build=true
          if [[ "$EVENT_NAME" != "workflow_dispatch" && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            base="$BASE_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            fi
            if git diff --quiet "$base" "$HEAD_SHA" -- . ':(glob,exclude)docs/**' ':(glob,exclude)**/*.md'; then
              build=false
            else
              exit_code=$?
              if [[ "$exit_code" -ne 1 ]]; then
                exit "$exit_code"
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Skip documentation-only build
        if: steps.changes.outputs.build == 'false'
        run: echo "Documentation-only changes; native and Docker builds skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Set image name
        if: steps.changes.outputs.build == 'true'
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache Quinoa Node install
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: .quinoa
          key: quinoa-${{ hashFiles('src/main/resources/application.properties') }}
          restore-keys: quinoa-

      - name: Cache npm downloads
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('src/main/webui/package-lock.json') }}
          restore-keys: npm-

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Image metadata
        if: steps.changes.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # Pushes to the default branch (main) publish a single 'dev' tag.
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs the full test suite, builds the Vue frontend (Quinoa) and compiles the GraalVM
      # native runner. Mandrel runs in a container, so no local GraalVM is required.
      - name: Build native runner (tests, frontend, native compile)
        if: steps.changes.outputs.build == 'true'
        run: mvn -B --no-transfer-progress package -Dnative -Dquarkus.native.container-build=true -Dquarkus.quinoa.ci=true

      - name: Build and optionally publish the native image
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.native
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}