name: Docker image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache Quinoa Node install
        uses: actions/cache@v6
        with:
          path: .quinoa
          key: quinoa-${{ hashFiles('src/main/resources/application.properties') }}
          restore-keys: quinoa-

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('src/main/webui/package-lock.json') }}
          restore-keys: npm-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # Pushes to the default branch (main) publish a single 'dev' tag.
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs the full test suite, builds the Vue frontend (Quinoa) and compiles the GraalVM
      # native runner. Mandrel runs in a container, so no local GraalVM is required.
      - name: Build native runner (tests, frontend, native compile)
        run: mvn -B --no-transfer-progress package -Dnative -Dquarkus.native.container-build=true -Dquarkus.quinoa.ci=true

      - name: Build and optionally publish the native image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.native
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}