name: OpenAPI docs

# Publishes an interactive OpenAPI doc (Redoc) to GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/application.properties'
      - 'pom.xml'
      - '.github/workflows/openapi-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Generate OpenAPI schema
        # Quinoa (frontend) is not needed to emit the schema; skip it to keep CI fast and node-free.
        run: mvn -B -q -DskipTests -Dquarkus.quinoa.enabled=false package

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp target/generated/openapi/openapi.yaml site/openapi.yaml
          cp target/generated/openapi/openapi.json site/openapi.json
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <title>Wallet Viewer API</title>
            <style>body { margin: 0; padding: 0; }</style>
          </head>
          <body>
            <redoc spec-url="openapi.yaml"></redoc>
            <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC token required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
