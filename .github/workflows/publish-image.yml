name: Release - Publish Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. 1.0.2'
        required: true
        type: string
  # Can also be called by automation to publish an existing tag.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and release, e.g. 1.0.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          RAW: ${{ inputs.tag }}
        run: |
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Expected a semver tag X.Y.Z, got '$RAW'"; exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          case "$RAW" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.version }}
          persist-credentials: false

      - name: Image tags
        id: tags
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          # A X.Y.Z tag publishes X.Y.Z; 'latest' is added only for non-prerelease tags.
          tags="$name:$VERSION"
          [ "$PRERELEASE" = "false" ] && tags="$tags"$'\n'"$name:latest"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache Quinoa Node install
        uses: actions/cache@v6
        with:
          path: .quinoa
          key: quinoa-${{ hashFiles('src/main/resources/application.properties') }}
          restore-keys: quinoa-

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('src/main/webui/package-lock.json') }}
          restore-keys: npm-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs the full test suite, builds the Vue frontend (Quinoa) and compiles the GraalVM
      # native runner. Mandrel runs in a container, so no local GraalVM is required.
      - name: Build native runner (tests, frontend, native compile)
        run: mvn -B --no-transfer-progress verify -Dnative -Dquarkus.native.container-build=true -Dquarkus.quinoa.ci=true

      - name: Upload released OpenAPI schema
        uses: actions/upload-artifact@v7
        with:
          name: release-openapi
          path: |
            target/generated/openapi/openapi.yaml
            target/generated/openapi/openapi.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Build and publish the native image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
