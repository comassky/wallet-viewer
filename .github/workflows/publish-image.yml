name: Publish image

on:
  push:
    tags: ['*.*.*']
  # Manual fallback: rebuild/publish an existing tag when a GITHUB_TOKEN push
  # (e.g. from the Release workflow) did not trigger this one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. 1.0.2'
        required: true
        type: string
  # Called by the Release workflow so the image builds in the same run (no PAT needed).
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and release, e.g. 1.0.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          RAW: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Expected a semver tag X.Y.Z, got '$RAW'"; exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          case "$RAW" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.version }}
          persist-credentials: false

      - name: Image tags
        id: tags
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          # A X.Y.Z tag publishes X.Y.Z; 'latest' is added only for non-prerelease tags.
          tags="$name:$VERSION"
          [ "$PRERELEASE" = "false" ] && tags="$tags"$'\n'"$name:latest"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # actions/cache stores each build cache dir; declared before the cache-dance
      # step so their save (post) runs after the mounts are extracted back to disk.
      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: .m2-cache
          key: m2-${{ hashFiles('pom.xml') }}
          restore-keys: m2-

      - name: Cache Quinoa Node install
        uses: actions/cache@v5
        with:
          path: .quinoa-cache
          key: quinoa-${{ hashFiles('src/main/resources/application.properties') }}
          restore-keys: quinoa-

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: .npm-cache
          key: npm-${{ hashFiles('src/main/webui/package-lock.json') }}
          restore-keys: npm-

      # Persist the BuildKit cache mounts (not covered by type=gha) across runs.
      - name: Inject build caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              ".m2-cache": "/root/.m2",
              ".quinoa-cache": "/workspace/.quinoa",
              ".npm-cache": "/root/.npm"
            }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile build runs the full test suite, so a failing build blocks the release.
      - name: Build, test and publish the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
