name: Auto-merge after build

on:
  workflow_run:
    workflows:
      - Docker - Build and Publish Dev
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge associated pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pull_requests=$(gh api --paginate "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" |
            jq -r --arg sha "$HEAD_SHA" '.[] | select(.state == "open" and .draft == false and .head.sha == $sha) | .number')

          while IFS= read -r pr_number; do
            [ -n "$pr_number" ] || continue
            gh pr merge "$pr_number" --squash --repo "$REPOSITORY"
          done <<< "$pull_requests"
