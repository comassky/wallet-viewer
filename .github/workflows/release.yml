name: Release - Create and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version X.Y.Z (without -SNAPSHOT)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit the version bumps and push the release tag
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Compute versions
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z (e.g. 1.2.3), got '$VERSION'"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$VERSION"
          {
            echo "release=$VERSION"
            echo "tag=$VERSION"
            echo "next=${major}.${minor}.$((patch + 1))-SNAPSHOT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fail if tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set release version and tag
        env:
          RELEASE: ${{ steps.version.outputs.release }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mvn -B -q versions:set -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
          git commit -am "Release $RELEASE"
          git tag -a "$TAG" -m "Release $RELEASE"

      - name: Set next development version
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          mvn -B -q versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          git commit -am "Prepare next development iteration $NEXT"

      - name: Push branch and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push origin HEAD:main
          git push origin "refs/tags/$TAG"

  # Builds/publishes the image and creates the GitHub Release in the same run.
  publish:
    needs: release
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # Publishes the released OpenAPI doc (Redoc) to GitHub Pages, after the image/release are out.
  # One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
  openapi:
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC token required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download released OpenAPI schema
        uses: actions/download-artifact@v4
        with:
          name: release-openapi
          path: site

      - name: Assemble Pages site
        run: |
          test -s site/openapi.yaml
          test -s site/openapi.json
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <title>Wallet Viewer API</title>
            <style>body { margin: 0; padding: 0; }</style>
          </head>
          <body>
            <redoc spec-url="openapi.yaml"></redoc>
            <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
