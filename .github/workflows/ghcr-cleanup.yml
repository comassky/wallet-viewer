name: Cleanup images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Mondays at 04:00 UTC

permissions:
  contents: read

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write # delete GHCR package versions
    steps:
      - name: Package name
        id: pkg
        run: echo "name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      # Deletes only dangling (untagged) versions left by rebuilds. Every tagged
      # version is kept: dev (latest main), latest (latest release) and each X.Y.Z.
      # User-owned GHCR packages need a PAT with delete:packages; the default
      # GITHUB_TOKEN cannot delete them, so set GHCR_CLEANUP_TOKEN.
      - name: Delete untagged GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.pkg.outputs.name }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
